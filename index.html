.pageWrap{

.container{

border-radius:16px;

border:1px solid rgba(255,209,0,.35);

}

.sheetLink{

position:absolute;
top:12px;
right:12px;
background:#43a047;
color:white;
text-decoration:none;
font-size:11px;

white-space:nowrap;

}

.sheetLink:hover{

background:#2e7d32;

}

h1{

text-align:center;
margin-top:22px;
margin-bottom:12px;
font-size:22px;
color:#000000;
letter-spacing:0.5px;

}

.formGrid{

display:grid;
grid-template-columns:1fr 1fr;
gap:0px 14px;

}

.fullWidth{

grid-column:1 / -1;

}

.row{

margin-bottom:10px;

}

label{

display:block;
font-weight:bold;
margin-bottom:3px;
font-size:13px;

}

input{

width:100%;
padding:8px 10px;
font-size:14px;
border:1px solid #ccc;

}

.readonly{

background:rgba(236,236,236,0.9);

}

.section{

margin-top:12px;

}

.section h2{

font-size:15px;
margin-bottom:8px;
color:#444;

}

button{

width:100%;
padding:10px;
border:none;
border-radius:9px;
background:#1e88e5;
color:white;
font-size:15px;
cursor:pointer;

}

button:hover{

background:#1565c0;

}

.smallButton{

margin-top:6px;
padding:8px;

}

.smallButton:hover{

background:#2e7d32;

}

.total{

font-weight:bold;
margin-top:8px;

}

}

}

}

height:26px;

color:white;

padding:0;

}

.container{

}

}

 <script>

// ----------------------------
// Default Date = Today (editable)
// ----------------------------

const today=new Date();
document.getElementById("date").value=today.toISOString().split("T")[0];

// ----------------------------
// Driver Dropdown (saved in browser, persists across visits)
// ----------------------------

const DEFAULT_DRIVERS = [];

const driverSelect = document.getElementById("driver");
const addDriverBtn = document.getElementById("addDriverBtn");
const deleteDriverBtn = document.getElementById("deleteDriverBtn");

function loadDrivers(){
    let saved = localStorage.getItem("driverList");
    let drivers = saved ? JSON.parse(saved) : DEFAULT_DRIVERS;
    return drivers;
}

function saveDrivers(drivers){
    localStorage.setItem("driverList", JSON.stringify(drivers));
}

function renderDrivers(selectedName){
    const drivers = loadDrivers();

    driverSelect.innerHTML = "";

    if(drivers.length === 0){
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "-- No drivers yet, click ✏️ to add --";
        driverSelect.appendChild(opt);
        return;
    }

    drivers.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        driverSelect.appendChild(opt);
    });

    if(selectedName){
        driverSelect.value = selectedName;
    }
}

addDriverBtn.addEventListener("click", () => {

    const newName = prompt("Enter new driver name:");

    if(!newName || !newName.trim()){
        return;
    }

    const trimmedName = newName.trim();
    const drivers = loadDrivers();

    if(drivers.includes(trimmedName)){
        alert("This driver is already in the list.");
        renderDrivers(trimmedName);
        return;
    }

    drivers.push(trimmedName);
    saveDrivers(drivers);
    renderDrivers(trimmedName);

});

renderDrivers();

deleteDriverBtn.addEventListener("click", () => {

    const selectedName = driverSelect.value;

    if(!selectedName){
        alert("No driver selected to delete.");
        return;
    }

    const confirmDelete = confirm(`Delete driver "${selectedName}" from the list?`);

    if(!confirmDelete){
        return;
    }

    let drivers = loadDrivers();
    drivers = drivers.filter(name => name !== selectedName);
    saveDrivers(drivers);
    renderDrivers();

});

// ----------------------------
// Fuel & Toll Entry Section
// ----------------------------

const fuelContainer = document.getElementById("fuelContainer");
const tollContainer = document.getElementById("tollContainer");

// Main fields (declared early so calculateAll can use them
// as soon as the first fuel/toll entry is created below)
const cashCollectedInput = document.getElementById("cashCollected");
const salaryInput = document.getElementById("salary");
const fuelPriceInput = document.getElementById("fuelPrice");
const mileageKmInput = document.getElementById("mileageKm");

let fuelCount = 0;
let tollCount = 0;

// First entry automatically create
addFuelEntry();
addTollEntry();

document
.getElementById("addFuel")
.addEventListener("click", addFuelEntry);

document
.getElementById("addToll")
.addEventListener("click", addTollEntry);


// ----------------------------
// ADD FUEL
// ----------------------------

function addFuelEntry(){

fuelCount++;

const div=document.createElement("div");

div.className="entryItem";

div.innerHTML=`

<input
type="number"
class="fuelInput"
placeholder="Fuel ${fuelCount}">

<button
type="button"
class="delBtn"
onclick="this.parentElement.remove();calculateAll();">

❌

</button>

`;

fuelContainer.appendChild(div);

div
.querySelector("input")
.addEventListener("input",calculateAll);

calculateAll();

}



// ----------------------------
// ADD TOLL
// ----------------------------

function addTollEntry(){

tollCount++;

const div=document.createElement("div");

div.className="entryItem";

div.innerHTML=`

<input
type="number"
class="tollInput"
placeholder="Toll ${tollCount}">

<button
type="button"
class="delBtn"
onclick="this.parentElement.remove();calculateAll();">

❌

</button>

`;

tollContainer.appendChild(div);

div
.querySelector("input")
.addEventListener("input",calculateAll);

calculateAll();

} // ----------------------------
// CALCULATIONS
// ----------------------------

// Whenever Cash or Salary changes
cashCollectedInput.addEventListener("input", calculateAll);
salaryInput.addEventListener("input", calculateAll);

function calculateAll() {

    // Cash Collected
    let cashCollected =
        parseFloat(cashCollectedInput.value) || 0;

    // -----------------------
    // Total Fuel
    // -----------------------

    let fuelTotal = 0;

    document
        .querySelectorAll(".fuelInput")
        .forEach(input => {

            fuelTotal +=
                parseFloat(input.value) || 0;

        });

    document.getElementById("fuelTotal").innerText =
        fuelTotal;

    // -----------------------
    // Total Toll
    // -----------------------

    let tollTotal = 0;

    document
        .querySelectorAll(".tollInput")
        .forEach(input => {

            tollTotal +=
                parseFloat(input.value) || 0;

        });

    document.getElementById("tollTotal").innerText =
        tollTotal;

    // -----------------------
    // Salary
    // -----------------------

    let salary =
        parseFloat(salaryInput.value) || 0;

    // -----------------------
    // Final Remaining
    // (Cash Collected - Fuel - Salary + Toll)
    // -----------------------

    let finalRemaining =
        cashCollected -
        fuelTotal -
        salary +
        tollTotal;

    document.getElementById("finalRemaining").value =
        finalRemaining;

    updateMileageCalculator();

} // ----------------------------
// MILEAGE CALCULATOR (independent mini calculator)
// Does NOT affect main calculator values.
// ----------------------------

function updateMileageCalculator(){

    // Auto-pull Total Fuel Cost from the main calculator (display only)
    const totalFuelCost =
        parseFloat(document.getElementById("fuelTotal").innerText) || 0;

    document.getElementById("mileageFuelCost").value = totalFuelCost;

    // Fuel Price (manual entry)
    const fuelPrice =
        parseFloat(fuelPriceInput.value) || 0;

    // Litres = Total Fuel Cost / Fuel Price
    let litres = 0;
    if(fuelPrice > 0){
        litres = totalFuelCost / fuelPrice;
    }

    document.getElementById("fuelLitres").value =
        fuelPrice > 0 ? litres.toFixed(2) : "";

    // Kilometer (manual entry, separate from main Kilometer field)
    const km =
        parseFloat(mileageKmInput.value) || 0;

    // Mileage (km/l) = Kilometer / Litres
    let mileage = 0;
    if(litres > 0){
        mileage = km / litres;
    }

    document.getElementById("mileageResult").value =
        litres > 0 ? mileage.toFixed(2) : "";

}

fuelPriceInput.addEventListener("input", updateMileageCalculator);
mileageKmInput.addEventListener("input", updateMileageCalculator);

const scriptURL = "https://script.google.com/macros/s/AKfycbz6jZXXtRWoIORFn7cOZMson8Ri_dVfoHc59FbvxG9hmbNQ3xBfV_zYPNj8qf3rQ6mz/exec";


document
.getElementById("saveButton")
.addEventListener("click", saveData);



function saveData(){

    let fuelValues = [];

    document
    .querySelectorAll(".fuelInput")
    .forEach(input => {

        if(input.value){
            fuelValues.push(input.value);
        }

    });



    let tollValues = [];

    document
    .querySelectorAll(".tollInput")
    .forEach(input => {

        if(input.value){
            tollValues.push(input.value);
        }

    });



    const data = {

        date:
        document.getElementById("date").value,


        vehicle:
        document.getElementById("vehicle").value,


        driver:
        document.getElementById("driver").value,


        kilometer:
        document.getElementById("kilometer").value,


        netCash:
        document.getElementById("netCash").value,


        cashCollected:
        document.getElementById("cashCollected").value,


        fuelDetails:
        fuelValues.join(" | "),


        totalFuel:
        document.getElementById("fuelTotal").innerText,


        tollDetails:
        tollValues.join(" | "),


        totalToll:
        document.getElementById("tollTotal").innerText,


        salary:
        document.getElementById("salary").value,


        finalRemaining:
        document.getElementById("finalRemaining").value

    };



    fetch(scriptURL, {

        method:"POST",

        body:JSON.stringify(data)

    })

    .then(response=>response.json())

    .then(result=>{


        alert("✅ Data Saved Successfully");


        console.log(result);


    })

    .catch(error=>{


        alert("❌ Error Saving Data");


        console.log(error);


    });


}

</script>
